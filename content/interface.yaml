app:
  assessmentLabel: AI fitness screening
  introduction: "Not how much you know. What you can actually do: create, delegate, sustain, verify, and notice opportunities."
  privacy: 11 behavioral questions · No login · Works offline
  principles:
    - AI fitness comes from doing, not knowing.
    - Your ideal profile depends on what you want to do.
    - The goal is a training direction, not a grade.

goals:
  category: Your goals
  prompt: How important will AI be to you in each of these areas?
  hint: Rate every area. Your answers shape the profile you need; they do not raise your score.
  levels: [Not relevant, Curious, Useful, Important, Central]

